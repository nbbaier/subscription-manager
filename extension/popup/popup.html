<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1f2937;
      background: #f9fafb;
    }

    .header {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .header .icon {
      font-size: 24px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .status-item {
      text-align: center;
    }

    .status-item .value {
      font-size: 18px;
      font-weight: 600;
      color: #3b82f6;
    }

    .status-item .label {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.online {
      background: #10b981;
    }

    .status-dot.offline {
      background: #ef4444;
    }

    .section {
      padding: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .active-sessions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .session-domain {
      font-weight: 500;
      color: #1f2937;
    }

    .session-time {
      font-size: 13px;
      color: #10b981;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: #9ca3af;
    }

    .button {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .button-primary {
      background: #3b82f6;
      color: white;
    }

    .button-primary:hover {
      background: #2563eb;
    }

    .button-secondary {
      background: white;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .button-secondary:hover {
      background: #f3f4f6;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px 16px;
    }

    .pending-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background: #fbbf24;
      color: #1f2937;
      font-size: 11px;
      font-weight: 600;
      border-radius: 10px;
      margin-left: 8px;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    .footer a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 13px;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">📊</span>
    <h1>Subscription Tracker</h1>
  </div>

  <div class="status-indicator">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <div class="value" id="trackedCount">-</div>
      <div class="label">Tracked</div>
    </div>
    <div class="status-item">
      <div class="value" id="activeCount">-</div>
      <div class="label">Active</div>
    </div>
    <div class="status-item">
      <div class="value" id="pendingCount">-</div>
      <div class="label">Pending</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Active Sessions</div>
    <div class="active-sessions" id="activeSessions">
      <div class="empty-state">No active sessions</div>
    </div>
  </div>

  <div class="buttons">
    <button class="button button-primary" id="syncBtn">
      Sync Now
      <span class="pending-badge" id="pendingBadge" style="display: none;">0</span>
    </button>
    <button class="button button-secondary" id="refreshBtn">
      Refresh Domains
    </button>
  </div>

  <div class="section" id="settingsSection" style="display: none; border-top: 1px solid #e5e7eb; margin-top: 8px;">
    <div class="section-title">Settings</div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <input type="text" id="apiUrlInput" placeholder="http://localhost:3000" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px;">
      <button class="button button-secondary" id="saveSettingsBtn" style="padding: 6px; font-size: 12px;">Save API URL</button>
    </div>
  </div>

  <div class="footer" style="display: flex; justify-content: space-between; align-items: center;">
    <a href="#" id="dashboardLink" target="_blank">Open Dashboard</a>
    <a href="#" id="toggleSettings" style="font-size: 16px; color: #6b7280;">⚙️</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
